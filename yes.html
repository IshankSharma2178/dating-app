<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yay! It's a Date! ❤️</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        
        <div class="tenor-gif-embed" data-postid="8595044491695252465" data-share-method="host" data-aspect-ratio="1" data-width="100%">
        <a href="https://tenor.com/view/pengu-pudgy-penguin-pudgypenguins-calendar-gif-8595044491695252465">Pengu Pudgy Sticker</a>from <a href="https://tenor.com/search/pengu-stickers">Pengu Stickers</a>
        </div>
        <script type="text/javascript" async src="https://tenor.com/embed.js"></script>

        <h1>Hehehehe, I knew it! 🥰</h1>
        <p class="subtitle">Now help your boy plan the perfect day for us:</p>

        <form action="https://formspree.io/f/xnjyyqqn" method="POST" class="date-form animate-form">
            
            <div class="form-group">
                <label for="date">When are you free to bless my presence? 📅</label>
                <input type="date" id="date" name="date" required>
            </div>

            <div class="form-group">
                <label for="Name">What is your name? </label>
                <input type="text" id="Name" name="Name" required>
            </div>

            <div class="form-group">
                <label for="time">What time should I pick you up? ⏰</label>
                <input type="time" id="time" name="time" required>
            </div>

            <div class="form-group">
                <label for="food">What are we eating? (Crucial question) 🍕</label>
                <select id="food" name="food_preference" required>
                    <option value="" disabled selected>Select a cuisine...</option>
                    <option value="Cozy Cafe Date">☕ Cozy Cafe & Desserts</option>
                    <option value="Fast Food / Pizza">🍕 Pizza / Burgers & Fries</option>
                    <option value="Fine Dining">🕯️ Fancy Candlelight Dinner</option>
                    <option value="Street Food Hop">🍿 Street Food & Chaotic Walking</option>
                    <option value="Surprise Me">🎁 Keep it a secret, surprise me!</option>
                </select>
            </div>

            <div class="form-group">
                <label for="outfit">Should we match outfit colors? 👗👔</label>
                <div class="radio-group">
                    <label><input type="radio" name="match_outfits" value="Yes, absolutely" checked> Yes, obviously! Twin with me.</label>
                    <label><input type="radio" name="match_outfits" value="No, let us surprise each other"> No, let's surprise each other.</label>
                </div>
            </div>

            <div class="form-group" id="color-picker-group" style="display: none;">
                <label for="twin_color">Pick a matching color 🎨</label>
                <input type="color" id="twin_color" name="twin_color" value="#ff4d4d">
            </div>

            <div class="form-group">
                <label for="excitement">Your excitement level for this date: 📈</label>
                <div class="range-container">
                    <span>A little bit🤏</span>
                    <input type="range" id="excitement" name="excitement_level" min="1" max="10" value="10">
                    <span>To the moon! 🚀</span>
                </div>
            </div>

            <div class="form-group">
                <label for="notes">Any specific songs you want to listen in earphones during the walk? Or special demands? 🧸</label>
                <textarea id="notes" name="special_demands" rows="3" placeholder="Tell me your favorite snacks, instructions, or requirements..."></textarea>
            </div>

            <button type="submit" class="submit-btn">Send to My Boy 💌</button>
        </form>
    </div>
    <script src="script.js"></script>
</body>
</html>
